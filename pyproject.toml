[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "couture-forecast-job"
version = "0.1.0"
description = "Isolated nightly demand forecasting job for Couture POS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "statsforecast>=2.0,<3",
]

[project.urls]
StatsForecast = "https://github.com/Nixtla/statsforecast"

[project.scripts]
couture-forecast = "job:main"

[tool.setuptools]
py-modules = ["job"]
