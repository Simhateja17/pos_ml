name: Deploy ML job to GCP VMs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation — no stored key

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - region: india
            instance: ambel-india-backend
            zone: asia-south1-c
          - region: international
            instance: instance-20260821-044801
            zone: us-central1-c
    env:
      GCP_PROJECT: refreshing-oven-489212-j9
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Pull latest ML code and reinstall (${{ matrix.region }})
        run: |
          cat > remote-deploy.sh <<'REMOTE'
          set -euo pipefail
          cd "$HOME/Ambel_pos/ml"
          git pull --ff-only origin main
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e .
          REMOTE
          # OS Login uses a service-account home on hosted runners. Initialise
          # its SSH key first, then run the deployment as the VM's teja user,
          # which owns /home/teja/Ambel_pos and the production virtualenv.
          gcloud compute ssh "${{ matrix.instance }}" \
            --zone="${{ matrix.zone }}" \
            --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --quiet \
            --command=true </dev/null
          gcloud compute ssh "${{ matrix.instance }}" \
            --zone="${{ matrix.zone }}" \
            --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --quiet \
            --command='sudo -u teja -H bash -s' < remote-deploy.sh
          deployed_sha="$(gcloud compute ssh "${{ matrix.instance }}" \
            --zone="${{ matrix.zone }}" \
            --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --quiet \
            --command='sudo -u teja -H git -C /home/teja/Ambel_pos/ml rev-parse HEAD')"
          if [[ "$deployed_sha" != "$GITHUB_SHA" ]]; then
            echo "Expected deployed commit $GITHUB_SHA, found $deployed_sha" >&2
            exit 1
          fi
